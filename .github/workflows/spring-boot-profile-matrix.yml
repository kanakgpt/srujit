name: Spring Boot Profile CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-with-profile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [e1, e2, e3]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: ${{ matrix.profile }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'vR8#mQ2!xL9@pT5$wK4^nZ7&bH1*F6sD' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x ./mvnw

      - name: Run Maven tests with profile ${{ matrix.profile }}
        run: ./mvnw test

